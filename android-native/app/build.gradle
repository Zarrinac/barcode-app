plugins {
    id 'com.android.application'
}

def configuredApiBaseUrl = providers.gradleProperty('BARCODE_API_BASE_URL')
        .orElse(providers.environmentVariable('BARCODE_API_BASE_URL'))
        .orElse('http://bcrs.dcode.co.ir')
        .get()
def escapedApiBaseUrl = configuredApiBaseUrl
        .replace('\\', '\\\\')
        .replace('"', '\\"')

android {
    namespace = 'com.hisense.barcode.nativeapp'
    compileSdk = 36

    defaultConfig {
        applicationId = 'com.hisense.barcode.nativeapp'
        minSdk = 24
        targetSdk = 36
        versionCode = 2
        versionName = '0.1.1'

        buildConfigField('String', 'API_BASE_URL', "\"${escapedApiBaseUrl}\"")
        buildConfigField('boolean', 'FORCE_FRESH_LOGIN_ON_START', 'true')
    }

    buildFeatures {
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['-Xlint:deprecation']
}
